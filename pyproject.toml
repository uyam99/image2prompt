[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image2prompt"
version = "0.1.0"
description = "Generate image prompts from local image files."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gradio==5.49.1",
    "Jinja2>=3.1,<4",
    "numpy>=2,<3",
    "onnxruntime==1.20.1",
    "Pillow>=11,<12",
    "transformers==4.57.6",
]

[project.scripts]
image2prompt-analyze = "image2prompt.analyze:main"
image2prompt-caption = "image2prompt.smolvlm_caption:main"
image2prompt-check = "image2prompt.image_processing:main"
image2prompt-tag = "image2prompt.wd_tagger:main"
image2prompt-web = "image2prompt.ui:main"

[tool.setuptools]
packages = ["image2prompt"]
