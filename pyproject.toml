[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image2prompt"
version = "0.1.0"
description = "Generate image prompts from local image files."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2,<3",
    "onnxruntime==1.20.1",
    "Pillow>=12,<13",
]

[project.scripts]
image2prompt-check = "image2prompt.image_processing:main"
image2prompt-tag = "image2prompt.wd_tagger:main"

[tool.setuptools]
packages = ["image2prompt"]
