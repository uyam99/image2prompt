name: Build Windows standalone

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Download WD Tagger model
        shell: pwsh
        run: |
          uvx --from huggingface_hub hf download `
            SmilingWolf/wd-swinv2-tagger-v3 `
            model.onnx selected_tags.csv `
            --revision 627aef95638667ddcaa3ac8ae625e88ea5b02f51 `
            --local-dir models/wd-swinv2-tagger-v3

      - name: Check Python syntax
        run: uv run python -m compileall -q image2prompt packaging/desktop_entry.py

      - name: Build Windows application
        shell: pwsh
        run: .\packaging\build_windows.ps1

      - name: Verify bundle
        shell: pwsh
        run: |
          $required = @(
            "dist/image2prompt/image2prompt.exe",
            "dist/image2prompt/_internal/models/wd-swinv2-tagger-v3/model.onnx",
            "dist/image2prompt/_internal/models/wd-swinv2-tagger-v3/selected_tags.csv",
            "dist/image2prompt/_internal/image2prompt/florence_runner.py",
            "dist/image2prompt/_internal/bin/uv.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing bundled file: $path"
            }
          }
          & "dist/image2prompt/_internal/bin/uv.exe" --version

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: image2prompt-windows-x64
          path: dist/image2prompt
          compression-level: 0
          retention-days: 14
